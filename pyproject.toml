[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spikesense-studio"
version = "0.2.0"
description = "Time-series classification with spiking neural networks and optional quantum kernels"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["spiking-neural-network", "time-series", "classification", "quantum", "streamlit", "neucube"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.28.0",
    "torch>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pennylane==0.34.0",
    "autoray==0.6.9",
    "plotly>=5.8.0",
    "pyyaml>=6.0",
]

[project.scripts]
spikesense = "streamlit run app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snnqc*", "neucube*"]
