[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spikesense-studio"
version = "0.3.0"
description = "Time-series classification with spiking neural networks and optional quantum kernels"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["spiking-neural-network", "time-series", "classification", "quantum", "streamlit", "neucube"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit==1.50.0",
    "torch==2.8.0",
    "numpy==1.26.3",
    "pandas==2.1.4",
    "scikit-learn==1.3.0",
    "matplotlib==3.8.0",
    "seaborn==0.12.2",
    "tqdm==4.66.4",
    "pennylane==0.34.0",
    "pennylane-lightning==0.36.0",
    "autoray==0.6.9",
    "plotly==5.8.0",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["snnqc*", "neucube*"]
exclude = ["tests*"]
