[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spikesense-studio"
version = "0.3.0"
description = "Time-series classification with spiking neural networks and optional quantum kernels"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9,<3.15"
keywords = ["spiking-neural-network", "time-series", "classification", "quantum", "streamlit", "neucube"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.50,<2",
    "torch>=2.9,<2.12",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "scikit-learn>=1.7,<2",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<0.14",
    "tqdm>=4.66,<5",
    "pennylane>=0.43,<0.50",
    "autoray>=0.8,<1",
    "plotly>=6.3,<7",
    "pyyaml>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["snnqc*", "neucube*"]
exclude = ["tests*"]
